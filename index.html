<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>World Cup 2026 — Wall Chart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #eef2f8;
    --bg-2: #dce5f0;
    --paper: #ffffff;
    --ink: #0c1c36;
    --ink-muted: #46607e;
    --ink-faint: #90aac4;
    --rule: #cdd9e8;
    --accent: #c8961c;
    --win: #1b6e3a;
    --today: #c0392b;
    --today-bg: rgba(192, 57, 43, 0.09);
    --tom-bg: rgba(200, 150, 28, 0.09);
    --radius: 14px;
    --radius-sm: 8px;
    --card-shadow: 0 14px 46px rgba(12, 28, 54, 0.10), 0 2px 8px rgba(12, 28, 54, 0.05);
    color-scheme: light;
  }

  body.theme-dark {
    --bg: #07101f;
    --bg-2: #07101f;
    --paper: #0e1d32;
    --ink: #dde8f5;
    --ink-muted: #7a9bbf;
    --ink-faint: #2e4a65;
    --rule: #172d46;
    --accent: #e8b83e;
    --win: #2ecc6b;
    --today: #e05a4a;
    --today-bg: rgba(224, 90, 74, 0.13);
    --tom-bg: rgba(232, 184, 62, 0.10);
    --card-shadow: 0 18px 52px rgba(0, 0, 0, 0.55), 0 2px 10px rgba(0, 0, 0, 0.38);
    color-scheme: dark;
  }

  body {
    font-family: 'Lora', Georgia, serif;
    background: linear-gradient(165deg, var(--bg), var(--bg-2));
    min-height: 100vh;
    color: var(--ink);
    padding: 28px 22px 80px;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x: hidden;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- header banner ---------- */
  .banner {
    position: relative; overflow: hidden;
    display: flex; align-items: center; justify-content: space-between;
    gap: 16px 24px; flex-wrap: wrap;
    padding: 18px 24px; margin-bottom: 22px;
    border: 1px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    background:
      radial-gradient(130% 150% at 0% 0%, color-mix(in srgb, var(--win) 11%, transparent), transparent 52%),
      radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, var(--accent) 11%, transparent), transparent 52%),
      var(--paper);
  }
  /* host-nation accent: Canada red · Mexico green · USA navy */
  .banner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg,
      #d52b1e 0%, #d52b1e 30%, #006847 38%, #006847 62%, #2a3a7a 70%, #2a3a7a 100%);
    opacity: .85;
  }
  .title h1 {
    font-size: 30px; font-weight: 600; letter-spacing: -0.4px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .title h1 .trophy { filter: saturate(1.05); }
  /* keep header content above the flag watermark */
  .banner > .title, .banner > .tools { position: relative; z-index: 1; }
  .hostflags {
    position: absolute; top: -16px; right: -8px; z-index: 0;
    font-size: 96px; line-height: 1; letter-spacing: 4px;
    opacity: .12; pointer-events: none; user-select: none; white-space: nowrap;
  }

  .tools { display: flex; gap: 8px; align-items: center; }
  button.tool {
    font-family: 'DM Mono', monospace; font-size: 12px;
    background: var(--paper); color: var(--ink-muted);
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; transition: all .18s ease;
  }
  button.tool:hover { color: var(--ink); border-color: var(--ink-faint); transform: translateY(-1px); }

  .legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 4px;
    font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--ink-faint);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .tzline { font-family: 'DM Mono', monospace; font-size: 10px; color: var(--ink-faint); flex-shrink: 0; }
  .meta-row { display: flex; align-items: center; gap: 20px; margin: 0 0 14px; }

  /* ---------- section headings ---------- */
  .section-head { display: flex; align-items: center; gap: 14px; margin: 34px 0 18px; }
  .section-head h2 {
    font-size: 16px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ink-muted); white-space: nowrap;
  }
  .section-head .line { flex: 1; height: 1px; background: var(--rule); }

  /* ---------- group grid ---------- */
  .groups { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .group {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 15px 16px 13px; box-shadow: var(--card-shadow);
  }
  .group-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .group-title .letter {
    font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13px;
    color: var(--paper); background: var(--ink);
    width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  }
  .group-title .label { font-size: 12.5px; color: var(--ink-faint); letter-spacing: .5px; }

  /* standings table — colour strip lives on a dedicated first column so it
     stays pixel-aligned with each row regardless of cell content/flex. */
  table.stand { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.stand th {
    font-family: 'DM Mono', monospace; font-weight: 400; font-size: 10px;
    color: var(--ink-faint); text-align: center; padding: 2px 3px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  table.stand th.team-col { text-align: left; }
  table.stand td {
    font-size: 13px; padding: 5px 3px; text-align: center;
    border-top: 1px solid var(--rule);
  }
  table.stand th.strip, table.stand td.strip { width: 4px; padding: 0; border-top: none; }
  table.stand td.strip { background: transparent; }
  table.stand tr.q1 td.strip { background: var(--win); }
  table.stand tr.q2 td.strip { background: var(--accent); }
  table.stand tr.q3 td.strip { background: var(--ink-faint); }
  table.stand td.team-col { text-align: left; }
  table.stand td.team-col .tw { display: flex; align-items: center; gap: 7px; overflow: hidden; }
  table.stand td.team-col .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.stand td.pts { font-weight: 600; font-family: 'DM Mono', monospace; }
  .flag { font-size: 15px; line-height: 1; flex-shrink: 0; }

  /* fixtures */
  .fixtures { display: flex; flex-direction: column; gap: 3px; }
  .fix {
    padding: 5px 8px; border-radius: 8px; border: 1px solid transparent;
    transition: background .3s, border-color .3s;
  }
  .fix.today { background: var(--today-bg); border-color: color-mix(in srgb, var(--today) 22%, transparent); }
  .fix.tomorrow { background: var(--tom-bg); }
  .fix .when {
    font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
  }
  .fix .when .city { margin-left: auto; }
  .fix.today .when { color: var(--today); }
  .fix .chip {
    font-size: 8px; letter-spacing: .6px; text-transform: uppercase;
    padding: 1px 5px; border-radius: 999px; font-weight: 500;
  }
  .fix.today .chip { background: var(--today); color: var(--paper); }
  .fix.tomorrow .chip { background: color-mix(in srgb, var(--accent) 75%, transparent); color: var(--paper); }
  .fix .match {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; font-size: 12.5px;
  }
  .fix .home { text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 6px; overflow: hidden; }
  .fix .away { text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 6px; overflow: hidden; }
  .fix .home .nm, .fix .away .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fix .score { display: flex; align-items: center; gap: 3px; }
  input.sc {
    width: 30px; height: 26px; text-align: center; font-family: 'DM Mono', monospace;
    font-size: 13px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--bg); color: var(--ink); -moz-appearance: textfield;
  }
  input.sc::-webkit-outer-spin-button, input.sc::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input.sc:focus { outline: none; border-color: var(--accent); background: var(--paper); }
  .fix .dash { color: var(--ink-faint); font-size: 11px; }

  /* ---------- bracket ---------- */
  .bracket-scroll { overflow-x: auto; padding: 6px 2px 20px; }
  .bracket { display: flex; gap: 26px; min-width: max-content; align-items: stretch; }
  .round { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; min-width: 188px; }
  .round-label {
    font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-faint); text-align: center; margin-bottom: 4px;
  }
  .tie {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 10px; padding: 6px; box-shadow: var(--card-shadow);
  }
  .tie .mno {
    font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--ink-faint);
    text-align: center; margin-bottom: 3px; letter-spacing: .5px;
  }
  .tie .slot {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 6px; padding: 4px 5px; border-radius: 6px; font-size: 12.5px; min-height: 30px;
  }
  .tie .slot + .slot { margin-top: 2px; border-top: 1px solid var(--rule); border-radius: 0 0 6px 6px; }
  .tie .slot .team { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .tie .slot .team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tie .slot.tbd .team { color: var(--ink-faint); font-style: italic; }
  /* provisional group placing — settled once the group finishes */
  .tie .slot .nm.prov { border-bottom: 1px dotted var(--ink-faint); opacity: .85; }
  /* projected matchup (Caley model) shown until the real team is known */
  .tie .slot.tbd .team:has(.proj-team) { color: var(--ink-muted); font-style: normal; }
  .tie .slot .nm.proj-team { border-bottom: 1px dotted var(--ink-faint); opacity: .9; }
  .tie .mproj {
    font-family: 'DM Mono', monospace; font-size: 7.5px; color: var(--ink-faint);
    text-align: center; margin-bottom: 3px; letter-spacing: .3px; opacity: .8;
  }
  .tie .slot.won .nm { font-weight: 600; color: var(--win); }
  .tie input.sc { width: 28px; height: 24px; font-size: 12px; border-radius: 5px; }
  .tie input.sc:focus { border-color: var(--accent); }
  .tie input.sc:disabled { opacity: .4; }
  .tie .pens {
    display: flex; gap: 4px; justify-content: center; align-items: center; flex-wrap: wrap;
    margin-top: 4px; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint);
  }
  .tie .pens button {
    font-family: 'DM Mono', monospace; font-size: 9px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--bg); color: var(--ink-muted);
    border-radius: 4px; padding: 1px 6px; max-width: 78px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .tie .pens button.sel { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  /* champion */
  .champ {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; min-width: 150px;
  }
  .champ .cup { font-size: 40px; filter: grayscale(.3); transition: filter .4s, transform .4s; }
  .champ.crowned .cup { filter: none; transform: scale(1.12); }
  .champ .who {
    font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-height: 26px;
  }
  .champ .who.tbd { color: var(--ink-faint); font-style: italic; font-size: 14px; }
  .champ .cap { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint); }

  .hint { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-top: 8px; }

  /* today-bar / meta-right */
  .today-bar {
    width: 100%; display: flex; flex-wrap: nowrap; justify-content: space-evenly;
    align-items: center; gap: 7px;
    font-family: 'DM Mono', monospace; font-size: 13.5px; color: var(--ink-faint);
  }
  .today-bar .meta-status { color: var(--ink-muted); white-space: nowrap; flex-shrink: 0; }
  .today-bar .tb-game {
    flex: 1; display: inline-flex; align-items: center; justify-content: center;
    background: var(--paper); border: 1px solid var(--rule); border-radius: 14px;
    padding: 4px 12px; color: var(--ink-muted); white-space: nowrap;
  }
  .today-bar .tb-game .tb-main { display: flex; align-items: center; gap: 4px; }
  .today-bar .tb-game .tb-sc { font-weight: 600; color: var(--ink); }
  .today-bar .tb-game .tb-cd { font-size: 9px; color: var(--ink-faint); margin-left: 4px; }
  .today-bar .tb-game.done { border-color: color-mix(in srgb, var(--win) 45%, transparent); }
  .today-bar .tb-game.has-prev { cursor: pointer; }
  .today-bar .tb-game.has-prev:hover { opacity: 0.8; }

  @media (max-width: 640px) {
    .today-bar { flex-wrap: wrap; }
    .today-bar .meta-status { width: 100%; text-align: center; }
    .today-bar .tb-game { flex: 1 1 calc(50% - 8px); }
  }

  /* confirmed fixture */
  .fix.confirmed input.sc {
    background: transparent; border-color: transparent;
    font-weight: 600; pointer-events: none; cursor: default;
  }
  .fix.confirmed .chip { background: var(--win); color: var(--paper); }
  /* live fixture */
  .fix.live-now { border-left: 2px solid var(--today); }
  .fix.live-now input.sc { background:transparent; border-color:transparent; font-weight:600; pointer-events:none; cursor:default; color:var(--today); }
  .chip.live-chip { background:var(--today); color:#fff; animation:livepulse 1.2s ease-in-out infinite; }
  @keyframes livepulse { 0%,100%{opacity:1} 50%{opacity:.5} }
  .tb-game.live-now .tb-sc { color:var(--today); }

  /* KO tie date/venue line */
  .tie .mwhen {
    font-family: 'DM Mono', monospace; font-size: 7.5px; color: var(--ink-faint);
    text-align: center; margin-bottom: 3px; letter-spacing: .3px;
  }

  /* qualification markers */
  .stand .qs { font-size: 9px; flex-shrink: 0; }
  .stand tr.q-out > td { opacity: .42; }

  /* ---------- team-path modal ---------- */
  .stand .nm[data-team] { cursor: pointer; }
  .stand .nm[data-team]:hover { text-decoration: underline; text-decoration-color: var(--accent); }
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(7, 16, 31, 0.55); backdrop-filter: blur(3px);
    display: none; align-items: flex-start; justify-content: center;
    padding: 40px 16px; overflow-y: auto;
  }
  .modal-backdrop.open { display: flex; }
  .modal {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--radius); box-shadow: var(--card-shadow);
    max-width: 560px; width: 100%; padding: 22px 22px 26px;
    position: relative; animation: modalIn .22s ease;
  }
  @keyframes modalIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
  .modal-close {
    position: absolute; top: 10px; right: 14px;
    background: none; border: none; font-size: 24px; line-height: 1;
    color: var(--ink-faint); cursor: pointer; transition: color .15s;
  }
  .modal-close:hover { color: var(--ink); }
  .modal .mt-head {
    display: flex; align-items: center; gap: 10px;
    font-size: 23px; font-weight: 600; letter-spacing: -0.3px; margin-bottom: 3px;
  }
  .modal .mt-sub {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--ink-faint);
    margin-bottom: 6px;
  }
  .modal .scen { margin-top: 20px; }
  .modal .scen-title {
    font-family: 'DM Mono', monospace; font-size: 11.5px; letter-spacing: .5px;
    text-transform: uppercase; color: var(--ink-muted); margin-bottom: 6px;
  }
  .modal .scen-title b { color: var(--accent); }
  .modal .opp-head { font-size: 13px; color: var(--ink-muted); margin: 6px 0 8px; line-height: 1.4; }
  .modal .opp-head b { color: var(--ink); font-weight: 600; }
  /* projected R32 opponents (Caley model) */
  .modal .pj-block { border-top: 1px solid var(--rule); padding-top: 16px; }
  .modal .pj-src { color: var(--ink-faint); font-weight: 400; }
  .modal .pj-row { display: grid; grid-template-columns: 1fr 90px 34px; align-items: center; gap: 8px; margin: 5px 0; }
  .modal .pj-opp { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); overflow: hidden; }
  .modal .pj-opp .flag { flex-shrink: 0; }
  .modal .pj-bar { height: 6px; background: var(--bg-2); border-radius: 3px; overflow: hidden; }
  .modal .pj-fill { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  .modal .pj-pct { font-family: 'DM Mono', monospace; font-size: 11.5px; color: var(--ink-muted); text-align: right; }
  .modal table.stand.mini { margin-bottom: 12px; }
  .modal table.stand.mini th.team-col { text-align: left; letter-spacing: .5px; }
  .stand tr.hl td { background: color-mix(in srgb, var(--accent) 17%, transparent); }
  .stand tr.hl td:first-child { border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
  .stand tr.hl td:last-child { border-top-right-radius: 6px; border-bottom-right-radius: 6px; }
  .stand tr.hl td.team-col .nm { font-weight: 600; }
  .modal .nm[data-jump] { cursor: pointer; }
  .modal .nm[data-jump]:hover { text-decoration: underline; text-decoration-color: var(--accent); }

  /* fixture preview */
  .fix.has-preview { cursor: pointer; }
  .fix.has-preview:hover { background: var(--bg-2); border-radius: 6px; }
  #prevModal { display:none; position:fixed; inset:0; z-index:9999; background:rgba(7,16,31,.7); backdrop-filter:blur(4px); overflow-y:auto; padding:24px 12px 48px; box-sizing:border-box; }
  .prev-box { background:var(--paper); max-width:660px; margin:0 auto; border-radius:14px; overflow:hidden; position:relative; box-shadow:0 24px 60px rgba(0,0,0,.4); }
  .prev-hd { background:var(--ink); padding:20px 52px 16px 24px; }
  .prev-tag { font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:7px; }
  .prev-matchup { font-size:21px; font-weight:700; color:#fff; line-height:1.2; }
  .prev-fm { font-size:11px; color:var(--ink-faint); margin-top:6px; }
  .prev-close { position:absolute; top:14px; right:18px; background:none; border:none; font-size:22px; color:var(--ink-faint); cursor:pointer; line-height:1; padding:4px 6px; z-index:2; }
  .prev-close:hover { color:#fff; }
  .prev-xi { display:flex; gap:16px; padding:14px 24px; border-bottom:1px solid var(--rule); }
  .prev-xi-col { flex:1; }
  .prev-xi-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin-bottom:6px; }
  .prev-xi-names { font-size:12px; color:var(--ink); line-height:1.8; }
  .prev-sec { padding:14px 24px; border-bottom:1px solid var(--rule); }
  .prev-sec:last-of-type { border-bottom:none; }
  .prev-sec-hd { font-size:10px; text-transform:uppercase; letter-spacing:.1em; color:var(--accent); font-weight:700; margin-bottom:8px; }
  .prev-sec p { font-size:13px; color:var(--ink); line-height:1.65; margin:0; }
  .pw-list { list-style:none; padding:0; margin:0; }
  .pw-list li { padding:7px 0; border-bottom:1px solid var(--rule); font-size:13px; color:var(--ink); line-height:1.5; }
  .pw-list li:last-child { border-bottom:none; }
  .pw-list strong { color:var(--ink); }
  .pw-team { font-size:10px; color:var(--accent); font-weight:600; text-transform:uppercase; letter-spacing:.04em; margin-left:5px; vertical-align:1px; }
  .prev-probs { display:flex; padding:14px 24px; border-bottom:1px solid var(--rule); }
  .prev-prob { flex:1; text-align:center; }
  .prev-prob .pp-val { font-size:26px; font-weight:700; color:var(--ink); }
  .prev-prob .pp-lbl { font-size:10px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-muted); margin-top:3px; }
  .prev-note { font-size:11px; color:var(--ink-faint); padding:10px 24px 18px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="hostflags" aria-hidden="true">🇨🇦🇲🇽🇺🇸</div>
    <div class="title">
      <h1><span class="trophy">🏆</span> World Cup 2026 Wall Chart</h1>
    </div>
    <div class="tools">
      <button class="tool" id="themeBtn">◐</button>
      <button class="tool" id="resetBtn">↺</button>
    </div>
  </header>

  <div class="meta-row">
    <div class="today-bar" id="todayBar"></div>
  </div>

  <div class="section-head"><h2>Group Stage</h2><div class="line"></div></div>
  <div class="groups" id="groups"></div>

// All projected R32 opponents for one team, highest probability first. A team can
// reach the same opponent via different fixtures (depending where it finishes); those
// paths are mutually exclusive, so we sum their probabilities into one figure.
function teamProjMatchups(team){
  const agg = {};
  for(const m in PROJ_R32_FULL) PROJ_R32_FULL[m].forEach(([a,b,p]) => {
    const opp = a===team ? b : b===team ? a : null;
    if(opp==null || !p) return;
    agg[opp] = (agg[opp]||0) + p;
  });
  return Object.entries(agg).map(([opp,p])=>({opp,p})).sort((x,y)=>y.p-x.p);
}

/* ============================================================
   STATE (localStorage)
   ============================================================ */
const KEY = "wc2026-wallchart";
let state = load();
function load(){
  try { return Object.assign(blank(), JSON.parse(localStorage.getItem(KEY)||"{}")); }
  catch { return blank(); }
}
function blank(){ return { group:{}, ko:{}, pens:{}, theme:"light" }; }
function save(){ localStorage.setItem(KEY, JSON.stringify(state)); }

// CONFIRMED overrides user predictions for standings and display.
let LIVE = JSON.parse(localStorage.getItem('wc2026-live') || '{}'); // persists across refreshes

function getMatchResult(no){
  const lv = LIVE[no];
  if(lv) return {a:lv.a, b:lv.b};
  return CONFIRMED.group[no] || state.group[no] || null;
}

// Short team abbreviation for compact displays.
function abbr(name){

    "Ghana":"GHA","Panama":"PAN","Qatar":"QAT","Switzerland":"SUI","Czechia":"CZE"};
  return A[name] || name.slice(0,3).toUpperCase();

/* ============================================================
   STANDINGS  (group results keyed by real match number)
   ============================================================ */
function standings(g){
  const rows = {};
  GROUPS[g].forEach(t => rows[t] = {team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});
  FIX[g].forEach(fx => {
    const r = getMatchResult(fx[0]);
    if(!r || r.a===""||r.b===""||r.a==null||r.b==null) return;
    const h=+r.a, a=+r.b, H=rows[fx[2]], A=rows[fx[3]];
    H.P++; A.P++; H.GF+=h; H.GA+=a; A.GF+=a; A.GA+=h;
    if(h>a){ H.W++; A.L++; H.Pts+=3; }
    else if(a>h){ A.W++; H.L++; A.Pts+=3; }
    else { H.D++; A.D++; H.Pts++; A.Pts++; }
  });
  return Object.values(rows).map(r => (r.GD=r.GF-r.GA, r))
    .sort((x,y)=> y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || x.team.localeCompare(y.team));
}

function groupComplete(g){
  for(const fx of FIX[g]){
    const r = getMatchResult(fx[0]);
    if(!r || r.a===""||r.b===""||r.a==null||r.b==null) return false;
  }
  return true;
}

// Returns per-team qual status: 'through'|'out'|'maybe'|null
function qualStatus(g){
  const s = standings(g);
  const res = {}; s.forEach(r => res[r.team]=null);
  function maxPts(team){
    const row = s.find(r=>r.team===team); if(!row) return 0;
    const rem = FIX[g].filter(fx => {
      const r = getMatchResult(fx[0]);
      return !(r&&r.a!==""&&r.b!=="") && (fx[2]===team||fx[3]===team);
    }).length;
    return row.Pts + rem*3;
  }
  if(groupComplete(g)){
    s.forEach((r,i) => res[r.team] = i<2?'through':i===2?'maybe':'out');
    return res;
  }
  // Mark eliminated: can't reach 2nd place's current pts even with max wins
  const sec = s[1]; if(!sec) return res;
  s.forEach((r,i) => { if(i>=2 && maxPts(r.team) < sec.Pts) res[r.team]='out'; });
  // Mark secured top-2: current pts > max possible for 3rd
  const third = s[2]; if(!third) return res;
  [0,1].forEach(i => {
    if(s[i] && s[i].Pts > maxPts(third.team)) res[s[i].team]='through';
  });
  return res;
}
function groupsComplete(){
  for(const g in GROUPS) if(!groupComplete(g)) return false;
  return true;
}
// every team in the group has played at least once (i.e. matchday 1 is done) —
// the point at which provisional standings become meaningful in the bracket.
function groupRevealed(g){
  return standings(g).every(r => r.P >= 1);
}
function groupsRevealed(){
  for(const g in GROUPS) if(!groupRevealed(g)) return false;
  return true;
}

/* ----- third-place qualifiers + official allocation ----- */
let THIRDS = {};   // match number -> qualified third team (recomputed each render)
function computeThirds(){
  THIRDS = {};
  // provisional once every group has played its opening round (each team 1 game);
  // updates live and settles when the groups finish
  if(!groupsRevealed()) return;
  // rank all 12 third-placed teams; best 8 qualify
  const thirds = [];
  for(const g in GROUPS){ const s = standings(g); thirds.push(Object.assign({g}, s[2])); }
  thirds.sort((x,y)=> y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || x.g.localeCompare(y.g));
  const qualGroups = thirds.slice(0,8).map(t=>t.g);
  const key = qualGroups.slice().sort().join("");
  const val = THIRD_ALLOC[key];
  if(!val) return; // shouldn't happen — table covers all 495 combos
  MATCH_ORDER.forEach((m,i) => { THIRDS[m] = standings(val[i])[2].team; });
}

/* ============================================================
   KNOCKOUT RESOLUTION
   ============================================================ */
function resolveSource(src){
  if(src.t==='g'){ if(!groupRevealed(src.g)) return null; const s = standings(src.g); return s[src.r-1] ? s[src.r-1].team : null; }
  if(src.t==='3'){ return THIRDS[src.slot] || null; }
  if(src.t==='w'){ return koWinner(src.m); }
  return null;
}
// Is an R32 slot's source a *real* (finalised) team yet, vs. still a projection?
function r32SlotFinal(src){
  if(src.t==='g') return groupComplete(src.g);
  if(src.t==='3') return groupsComplete();
  return true;
}
function koWinner(m){
  const M = KO[m]; if(!M) return null;
  const ta = resolveSource(M.a), tb = resolveSource(M.b);
  if(!ta || !tb) return null;
  const r = state.ko[m]; if(!r) return null;
  if(r.a===""||r.b===""||r.a==null||r.b==null) return null;
  if(+r.a>+r.b) return ta;
  if(+r.b>+r.a) return tb;
  const p = state.pens[m];
  return p==='a' ? ta : p==='b' ? tb : null;
}

/* ============================================================
   DATE / TIME (local to the viewer's timezone)
   ============================================================ */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtWhen(iso){
  const d = new Date(iso);
  const date = DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()];
  const time = String(d.getHours()).padStart(2,'0') + ":" + String(d.getMinutes()).padStart(2,'0');
  return date + " · " + time;
}
function dayOffset(iso){
  const d = new Date(iso), n = new Date();
  const a = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const b = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((a-b)/86400000);
}
function fmtKoShort(iso){
  const d = new Date(iso);
  return d.getDate() + ' ' + MON[d.getMonth()] + ' · ' + String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}
function fmtCountdown(ms){
  if(ms<=0) return 'now';
  const m=Math.floor(ms/60000), h=Math.floor(m/60), dy=Math.floor(h/24);
  if(dy>=2) return dy+'d '+( h%24)+'h';
  if(h>=1)  return h+'h '+(m%60)+'m';
  return m+'m';
}
function getNextUnplayed(){
  const now = new Date(); let best = null;
  for(const g in GROUPS){
    FIX[g].forEach(fx => {
      if(CONFIRMED.group[fx[0]]) return;
      const r = state.group[fx[0]];
      if(r && r.a!=='' && r.b!=='') return;
      const t = new Date(fx[1]);
      if(t<=now) return;
      if(!best||t<best.t) best={t, home:fx[2], away:fx[3]};
    });
  }
  for(const m in KO_META){
    const r = state.ko[m];
    if(r && r.a!=='' && r.b!=='') continue;
    const t = new Date(KO_META[m].iso);
    if(t<=now) continue;
    if(!best||t<best.t){
      const M=KO[m]; if(!M) continue;
      best={t, home:resolveSource(M.a)||null, away:resolveSource(M.b)||null};
    }
  }
  return best;
}

const $ = s => document.querySelector(s);
function teamHTML(name){
  if(!name) return `<span class="team"><span class="nm">TBD</span></span>`;
  return `<span class="team"><span class="flag">${FLAG[name]||""}</span><span class="nm">${name}</span></span>`;
}

function renderGroups(){
  const host = $("#groups"); host.innerHTML = "";
  for(const g in GROUPS){
    const s = standings(g);
    const card = document.createElement("div");
    card.className = "group";
    const qs = qualStatus(g);
    const rows = s.map((r,i)=>{
      const stripCls = i===0?"q1":i===1?"q2":i===2?"q3":"";
      const status = qs[r.team];
      const rowCls = [stripCls, status==='out'?'q-out':''].filter(Boolean).join(' ');
      const qMark = status==='through'?`<span class="qs">✓</span>`:'';
      return `<tr class="${rowCls}">
        <td class="strip"></td>
        <td class="team-col"><span class="tw"><span class="flag">${FLAG[r.team]||""}</span><span class="nm" data-team="${r.team}">${r.team}</span>${qMark}</span></td>
        <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
        <td>${r.GD>0?"+":""}${r.GD}</td><td class="pts">${r.Pts}</td></tr>`;
    }).join("");
    const fixes = FIX[g].map(fx=>{
      const [no,iso,home,away,city] = fx;
      const lv = LIVE[no];
      const conf = (lv&&lv.done ? {a:lv.a,b:lv.b} : null) || CONFIRMED.group[no];
      const isLive = lv && !lv.done;
      const r = state.group[no] || {a:"",b:""};
      const off = dayOffset(iso);
      const dayCls = off===0?"today":off===1?"tomorrow":"";
      const fixCls = [dayCls, conf?"confirmed":"", isLive?"live-now":"", PREVIEWS[no]?"has-preview":""].filter(Boolean).join(' ');
      const liveLabel = isLive ? (lv.elapsed==='HT'?'HT':`${lv.elapsed}'`) : '';
      const chip = isLive
        ? `<span class="chip live-chip">${liveLabel||'LIVE'}</span>`
        : conf ? `<span class="chip">final</span>`
        : off===0 ? `<span class="chip">today</span>`
        : off===1 ? `<span class="chip">tomorrow</span>` : "";
      const va = conf?conf.a : isLive?lv.a : r.a;
      const vb = conf?conf.b : isLive?lv.b : r.b;
      const locked = (conf||isLive)?"disabled":"";
      return `<div class="fix ${fixCls}" data-no="${no}">
        <div class="when">${fmtWhen(iso)} ${chip}<span class="city">${city}</span></div>
        <div class="match">
          <span class="home"><span class="nm">${home}</span><span class="flag">${FLAG[home]||""}</span></span>
          <span class="score">
            <input class="sc" type="number" min="0" inputmode="numeric" data-gm="${no}" data-side="a" value="${va}" ${locked}>
            <span class="dash">–</span>
            <input class="sc" type="number" min="0" inputmode="numeric" data-gm="${no}" data-side="b" value="${vb}" ${locked}>
          </span>
          <span class="away"><span class="flag">${FLAG[away]||""}</span><span class="nm">${away}</span></span>
        </div>
      </div>`;
    }).join("");
    card.innerHTML = `
      <div class="group-title"><span class="letter">${g}</span><span class="label">Group ${g}</span></div>
      <table class="stand">
        <tr><th class="strip"></th><th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
        ${rows}
      </table>
      <div class="fixtures">${fixes}</div>`;
    host.appendChild(card);
  }
}

function slotEl(m, side, src, resolved, winner){
  // For R32 ties we show Caley's projected team until the feeding group is
  // actually finished; everywhere else a resolved team is treated as final.
  const isR32 = !!PROJ_R32[m];
  const slotFinal = isR32 ? (!!resolved && r32SlotFinal(src)) : !!resolved;
  const proj = (isR32 && !slotFinal) ? PROJ_R32[m][side] : null;
  const wrap = document.createElement("div");
  wrap.className = "slot" + (slotFinal?"":" tbd") + (winner&&slotFinal&&resolved===winner?" won":"");
  let teamPart;
  if(slotFinal){
    // provisional = a live (non-R32) group placing whose group hasn't finished yet
    const prov = !isR32 && src.t==='g' && !groupComplete(src.g);
    teamPart = `<span class="team"><span class="flag">${FLAG[resolved]||""}</span><span class="nm${prov?' prov':''}">${resolved}</span></span>`;
  }
  else if(proj){
    // projected from Caley's model until the real team is known
    teamPart = `<span class="team"><span class="flag">${FLAG[proj]||""}</span><span class="nm proj-team">${proj}</span></span>`;
  }
  else if(src.t==='3') teamPart = `<span class="team"><span class="nm">3rd ${src.groups.join("/")}</span></span>`;
  else teamPart = `<span class="team"><span class="nm">${labelFor(src)}</span></span>`;
  const r = state.ko[m] || {a:"",b:""};
  const disabled = slotFinal ? "" : "disabled";
  wrap.innerHTML = `${teamPart}<input class="sc" type="number" min="0" inputmode="numeric" data-ko="${m}" data-side="${side}" value="${r[side]}" ${disabled}>`;
  return wrap;
}
function labelFor(src){
  if(src.t==='g') return "Group " + src.g + (src.r===1?" · 1st":src.r===2?" · 2nd":" · 3rd");
  if(src.t==='w') return "Winner " + src.m;
  return "TBD";
}
function tieEl(m){
  const M = KO[m];
  const ta = resolveSource(M.a), tb = resolveSource(M.b);
  const w = koWinner(m);
  const el = document.createElement("div");
  el.className = "tie";
  const meta = KO_META[m];
  // projection probability shown only while both slots are still projected
  const aFinal = !!ta && r32SlotFinal(M.a);
  const bFinal = !!tb && r32SlotFinal(M.b);
  const showProj = PROJ_R32[m] && !aFinal && !bFinal;
  const projChip = showProj ? `<div class="mproj">proj ${PROJ_R32[m].p}%</div>` : '';
  el.innerHTML = `<div class="mno">Match ${m}</div>${meta?`<div class="mwhen">${fmtKoShort(meta.iso)} · ${meta.city}</div>`:''}${projChip}`;

  el.appendChild(slotEl(m,'a',M.a,ta,w));
  el.appendChild(slotEl(m,'b',M.b,tb,w));
  const r = state.ko[m];
  if(ta && tb && r && r.a!=="" && r.b!=="" && r.a!=null && r.b!=null && +r.a===+r.b){
    const p = state.pens[m];
    const pens = document.createElement("div");
    pens.className = "pens";
    pens.innerHTML = `pens
      <button data-pen="${m}" data-win="a" class="${p==='a'?'sel':''}">${ta}</button>
      <button data-pen="${m}" data-win="b" class="${p==='b'?'sel':''}">${tb}</button>`;
    el.appendChild(pens);
  }
  return el;
}

function renderBracket(){
  computeThirds();
  const host = $("#bracket"); host.innerHTML = "";
  ROUNDS.forEach(round => {
    const col = document.createElement("div");
    col.className = "round";
    col.innerHTML = `<div class="round-label">${round.label}</div>`;
    round.ms.forEach(m => col.appendChild(tieEl(m)));
    host.appendChild(col);
  });
  const champ = document.createElement("div");
  champ.className = "champ";
  const w = koWinner(104);
  champ.classList.toggle("crowned", !!w);
  champ.innerHTML = `<div class="cap">Champions</div><div class="cup">🏆</div>
    <div class="who ${w?'':'tbd'}">${w?`<span class="flag">${FLAG[w]||""}</span>${w}`:"—"}</div>`;
  host.appendChild(champ);

  $("#koHint").innerHTML = groupsComplete()
    ? "Groups are in — the eight best third-placed teams have been slotted automatically using FIFA's official allocation table."
    : "Round of 32 shows the <b>most-likely matchup</b> for each tie (with its probability) from Michael Caley's projection model, until each group finishes and the real teams lock in.";
}

/* preserve focus + caret + scroll across full re-render (no more jump) */
function rerender(fn){
  const ae = document.activeElement;
  let key = null, caret = null;
  if(ae && ae.classList && ae.classList.contains('sc')){
    key = ae.dataset.gm!==undefined ? ['gm',ae.dataset.gm,ae.dataset.side]
        : ae.dataset.ko!==undefined ? ['ko',ae.dataset.ko,ae.dataset.side] : null;
    caret = ae.selectionStart;
  }
  const sx = window.scrollX, sy = window.scrollY;
  fn();
  if(key){
    const sel = key[0]==='gm'
      ? `input[data-gm="${key[1]}"][data-side="${key[2]}"]`
      : `input[data-ko="${key[1]}"][data-side="${key[2]}"]`;
    const el = document.querySelector(sel);
    if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(caret,caret); }catch(e){} }
  }
  window.scrollTo(sx, sy);
}

/* live status pill — reads the real date + tournament state */
function renderTodayBar(){
  const bar = $('#todayBar'); if(!bar) return;
  // status label
  const all = [];
  for(const g in GROUPS) FIX[g].forEach(fx => all.push(fx[1]));
  all.sort();
  const firstOff = dayOffset(all[0]), lastOff = dayOffset(all[all.length-1]);
  const champ = koWinner(104);
  let label;
  if(champ)                                     label = 'Champions · ' + champ;
  else if(firstOff > 0)                         label = firstOff + ' day' + (firstOff>1?'s':'') + ' to kick-off';
  else if(lastOff >= 0)                         label = 'Group stage · Day ' + (1 - firstOff);
  else if(dayOffset("2026-07-19T20:00:00Z")>=0) label = 'Knockout stage';
  else                                          label = 'Tournament over';
  // today's games
  const games = [];
  for(const g in GROUPS) FIX[g].forEach(fx => { if(dayOffset(fx[1])===0) games.push(fx); });
  games.sort((a, b) => new Date(a[1]) - new Date(b[1]));
  const chips = games.map(fx => {
    const [no,iso,home,away] = fx;
    const lv = LIVE[no];
    const conf = (lv&&lv.done ? {a:lv.a,b:lv.b} : null) || CONFIRMED.group[no];
    const isLive = lv && !lv.done;
    const r = state.group[no];
    const hF=FLAG[home]||'', aF=FLAG[away]||'', hA=abbr(home), aA=abbr(away);
    let mid, done=false;
    if(conf){ mid=`${conf.a}–${conf.b}`; done=true; }
    else if(isLive){ mid=`${lv.a}–${lv.b}`; }
    else if(r&&r.a!==''&&r.b!=='') mid=`${r.a}–${r.b}`;
    else{ const d=new Date(iso); mid=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
    let cdStr = '';
    if(!done && !isLive && !(r&&r.a!==''&&r.b!=='')){
      const diff = new Date(iso) - new Date();
      if(diff > 0) cdStr = 'in ' + fmtCountdown(diff);
    }
    const prevCls = PREVIEWS[no] ? ' has-prev' : '';
    const liveCls = isLive ? ' live-now' : '';
    return `<span class="tb-game${done?' done':''}${liveCls}${prevCls}" data-no="${no}"><span class="tb-main">${hF} ${hA} <span class="tb-sc">${mid}</span> ${aA} ${aF}${cdStr?` <span class="tb-cd">${cdStr}</span>`:''}${isLive?` <span class="tb-cd">${lv.elapsed==='HT'?'HT':`${lv.elapsed}'`}</span>`:''}</span></span>`;
  }).join('');
  // countdown only when no games today
  if(!champ && !games.length){
    const nx = getNextUnplayed();
    if(nx){
      const diff = nx.t - new Date();
      const hA = nx.home?abbr(nx.home):'?', aA = nx.away?abbr(nx.away):'?';
      const hF = nx.home?FLAG[nx.home]||'':'', aF = nx.away?FLAG[nx.away]||'':'';
      label += ` · ${hF}${hA} v ${aA}${aF} in ${fmtCountdown(diff)}`;
    }
  }
  bar.innerHTML = `<span class="meta-status">${label}${games.length?' ·':''}</span> ${chips}`;
}

/* ============================================================
   TEAM-PATH MODAL — tap a team to see its Round-of-32 opponents
   ============================================================ */
function groupOf(team){
  for(const g in GROUPS) if(GROUPS[g].includes(team)) return g;
  return null;
}
// reverse-lookup: for a group placing (1st/2nd), find its R32 opponent source
function r32Opp(group, placing){
  for(const m of [73,74,75,76,77,78,79,80,81,82,83,84,85,86,87,88]){
    const M = KO[m]; if(!M) continue;
    if(M.a.t==='g' && M.a.g===group && M.a.r===placing) return M.b;
    if(M.b.t==='g' && M.b.g===group && M.b.r===placing) return M.a;
  }
  return null;
}
function ordinal(n){ return n===1?'1st':n===2?'2nd':n===3?'3rd':n+'th'; }
function placeWord(r){ return r===1?'winners':r===2?'runners-up':ordinal(r)+'-placed team'; }

// full mini standings table for a group, highlighting one placing row
function miniStand(g, hl){
  const s = standings(g);
  const rows = s.map((r,i)=>{
    const cls = (i+1)===hl ? 'hl' : '';
    return `<tr class="${cls}">
      <td class="team-col"><span class="tw"><span class="flag">${FLAG[r.team]||""}</span><span class="nm" data-jump="${r.team}">${r.team}</span></span></td>
      <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
      <td>${r.GD>0?"+":""}${r.GD}</td><td class="pts">${r.Pts}</td></tr>`;
  }).join("");
  return `<table class="stand mini">
    <tr><th class="team-col">Group ${g}</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
    ${rows}</table>`;
}
function renderOpp(opp){
  if(!opp) return `<div class="opp-head">—</div>`;
  if(opp.t==='g'){
    return `<div class="opp-head">vs the <b>${placeWord(opp.r)}</b> of Group ${opp.g}</div>${miniStand(opp.g, opp.r)}`;
  }
  if(opp.t==='3'){
    const tables = opp.groups.map(g => miniStand(g, 3)).join("");
    return `<div class="opp-head">vs the best <b>3rd-placed team</b> from these groups — the highlighted rows are who's 3rd right now. Settles once the group stage finishes.</div>${tables}`;
  }
  return `<div class="opp-head">—</div>`;
}
function showTeamPath(team){
  const g = groupOf(team); if(!g) return;
  const s = standings(g);
  const pos = s.findIndex(r => r.team===team) + 1;
  $("#modalBody").innerHTML = `
    <div class="mt-head"><span class="flag">${FLAG[team]||""}</span> ${team}</div>
    <div class="mt-sub">Currently ${ordinal(pos)} in Group ${g} · Round-of-32 opponent</div>
    <div class="scen">
      <div class="scen-title">If they finish <b>1st</b></div>
      ${renderOpp(r32Opp(g, 1))}
    </div>
    <div class="scen">
      <div class="scen-title">If they finish <b>2nd</b></div>
      ${renderOpp(r32Opp(g, 2))}
    </div>
    ${renderProjOpps(team)}`;
  $("#modalBack").classList.add("open");
}
// Caley's projected R32 opponents for this team, with probabilities
function renderProjOpps(team){
  const ms = teamProjMatchups(team);
  if(!ms.length) return '';
  const max = ms[0].p || 1;
  const rows = ms.map(({opp,p}) => `
    <div class="pj-row">
      <span class="pj-opp"><span class="flag">${FLAG[opp]||''}</span>${opp}</span>
      <span class="pj-bar"><span class="pj-fill" style="width:${Math.round(p/max*100)}%"></span></span>
      <span class="pj-pct">${p}%</span>
    </div>`).join('');
  return `<div class="scen pj-block">
    <div class="scen-title">Most-likely R32 opponents <span class="pj-src">· Caley model</span></div>
    ${rows}</div>`;
}
function closeModal(){ $("#modalBack").classList.remove("open"); }

function renderAll(){ renderGroups(); renderBracket(); renderTodayBar(); }

/* ============================================================
   LIVE SCORES
   ============================================================ */
async function fetchLive(){
  try {
    const {games} = await (await fetch('https://worldcup26.ir/get/games')).json();
    let changed = false;
    games.forEach(g => {
      // API returns string "null" for unplayed games
      if(!g.home_score || g.home_score === 'null' ||
         !g.away_score || g.away_score === 'null') return;
      if(g.time_elapsed === 'notstarted' || !g.time_elapsed) return;
      const no = +g.id;
      const done = g.finished === 'TRUE';
      const entry = {a:String(g.home_score), b:String(g.away_score), done, elapsed:g.time_elapsed};
      const prev = LIVE[no];
      if(!prev || prev.a !== entry.a || prev.b !== entry.b || prev.done !== entry.done){
        LIVE[no] = entry; changed = true;
      }
    });
    if(changed){
      localStorage.setItem('wc2026-live', JSON.stringify(LIVE));
      renderAll();
    }
  } catch(e){}
}

/* ============================================================
   PREVIEW
   ============================================================ */
function showPreview(no){
  const p = PREVIEWS[no];
  if(!p) return;
  const box = document.getElementById('prevBox');
  const hF = FLAG[p.home]||'', aF = FLAG[p.away]||'';
  const xiHTML = p.xi ? `<div class="prev-xi">
    <div class="prev-xi-col">
      <div class="prev-xi-lbl">${p.home} · ${p.formation.home}</div>
      <div class="prev-xi-names">${p.xi.home.join('<br>')}</div>
    </div>
    <div class="prev-xi-col" style="text-align:right">
      <div class="prev-xi-lbl">${p.away} · ${p.formation.away}</div>
      <div class="prev-xi-names">${p.xi.away.join('<br>')}</div>
    </div>
  </div>` : '';
  const probHTML = p.probs ? `<div class="prev-probs">
    <div class="prev-prob"><div class="pp-val">${p.probs.h}%</div><div class="pp-lbl">${p.home}</div></div>
    <div class="prev-prob"><div class="pp-val">${p.probs.d}%</div><div class="pp-lbl">Draw</div></div>
    <div class="prev-prob"><div class="pp-val">${p.probs.a}%</div><div class="pp-lbl">${p.away}</div></div>
  </div>` : '';
  box.innerHTML = `
    <button class="prev-close" onclick="closePrev()">✕</button>
    <div class="prev-hd">
      <div class="prev-tag">Group ${p.group} · Match ${no} · Preview</div>
      <div class="prev-matchup">${hF} ${p.home} <span style="color:var(--ink-faint);font-weight:400">vs</span> ${p.away} ${aF}</div>
      ${p.formation ? `<div class="prev-fm">${p.formation.home} &nbsp;·&nbsp; ${p.formation.away}</div>` : ''}
    </div>
    ${xiHTML}
    <div class="prev-sec">
      <div class="prev-sec-hd">The Storyline</div>
      <p>${p.storyline}</p>
    </div>
    <div class="prev-sec">
      <div class="prev-sec-hd">Tactical Battle</div>
      <p>${p.tactical}</p>
    </div>
    <div class="prev-sec">
      <div class="prev-sec-hd">Players to Watch</div>
      <ul class="pw-list">${p.watch.map(w=>`<li><strong>${w.name}</strong><span class="pw-team">${w.team}</span> — ${w.text}</li>`).join('')}</ul>
    </div>
    <div class="prev-sec">
      <div class="prev-sec-hd">What Each Team Needs</div>
      <p>${p.importance}</p>
    </div>
    ${probHTML}
    <div class="prev-note">★ Lineups are predicted, not confirmed. Win probabilities are synthesised estimates — not model outputs.</div>
  `;
  document.getElementById('prevModal').style.display = 'block';
  document.body.style.overflow = 'hidden';
}
function closePrev(){
  document.getElementById('prevModal').style.display = 'none';
  document.body.style.overflow = '';
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.gm!==undefined && t.classList.contains("sc")){
    const id = t.dataset.gm;
    state.group[id] = state.group[id] || {a:"",b:""};
    state.group[id][t.dataset.side] = t.value;
    save(); rerender(renderAll);
  } else if(t.dataset.ko!==undefined && t.classList.contains("sc")){
    const m = t.dataset.ko;
    state.ko[m] = state.ko[m] || {a:"",b:""};
    state.ko[m][t.dataset.side] = t.value;
    save(); rerender(renderBracket);
  }
});
document.addEventListener("click", e => {
  if(e.target.dataset.pen!==undefined){
    state.pens[e.target.dataset.pen] = e.target.dataset.win;
    save(); rerender(renderBracket);
    return;
  }
  // team name → Round-of-32 path modal
  const jump = e.target.closest('[data-team],[data-jump]');
  if(jump){ showTeamPath(jump.dataset.team || jump.dataset.jump); return; }
  // fixture preview — click anywhere on row except score inputs
  const fix = e.target.closest('.fix.has-preview');
  if(fix && !e.target.closest('input')){
    showPreview(+fix.dataset.no);
    return;
  }
  // today bar chip preview
  const chip = e.target.closest('.tb-game.has-prev');
  if(chip){ showPreview(+chip.dataset.no); return; }
  // click modal backdrop to close
  if(e.target.id === 'prevModal') closePrev();
  if(e.target.id === 'modalBack') closeModal();
});
document.addEventListener("keydown", e => { if(e.key==="Escape") closeModal(); });
$("#modalClose").onclick = closeModal;

$("#themeBtn").onclick = () => {
  state.theme = state.theme==="dark" ? "light" : "dark";
  document.body.classList.toggle("theme-dark", state.theme==="dark");
  save();
};
$("#resetBtn").onclick = () => {
  if(confirm("Clear all scores and predictions? This can't be undone.")){
    state = blank();
    document.body.classList.remove("theme-dark");
    save(); renderAll();
  }
};

/* ============================================================
   BOOT
   ============================================================ */
document.body.classList.toggle("theme-dark", state.theme==="dark");

renderAll();
setInterval(renderTodayBar, 60000); // keep countdown live
fetchLive();
setInterval(fetchLive, 60000); // auto-update scores
</script>
