<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>World Cup 2026 — Wall Chart</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏆</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f0e8;
    --bg-2: #ece2d3;
    --paper: #fdfaf4;
    --ink: #241c14;
    --ink-muted: #6b5e4e;
    --ink-faint: #b8a898;
    --rule: #e0d8cc;
    --accent: #b8852a;
    --win: #2f7d4f;
    --today: #c2622d;          /* warm terracotta for "today" */
    --today-bg: rgba(194, 98, 45, 0.10);
    --tom-bg: rgba(184, 133, 42, 0.08);
    --radius: 14px;
    --radius-sm: 8px;
    --card-shadow: 0 14px 46px rgba(74, 54, 34, 0.11), 0 2px 8px rgba(74, 54, 34, 0.05);
    color-scheme: light;
  }

  body.theme-dark {
    --bg: #17130f;
    --bg-2: #17130f;
    --paper: #211c17;
    --ink: #efe7da;
    --ink-muted: #b6a690;
    --ink-faint: #756758;
    --rule: #38302a;
    --accent: #e0b35e;
    --win: #5bb583;
    --today: #e08a4f;
    --today-bg: rgba(224, 138, 79, 0.13);
    --tom-bg: rgba(224, 179, 94, 0.09);
    --card-shadow: 0 18px 52px rgba(0, 0, 0, 0.46), 0 2px 10px rgba(0, 0, 0, 0.34);
    color-scheme: dark;
  }

  body {
    font-family: 'Lora', Georgia, serif;
    background: linear-gradient(165deg, var(--bg), var(--bg-2));
    min-height: 100vh;
    color: var(--ink);
    padding: 28px 22px 80px;
    transition: background 0.5s ease, color 0.5s ease;
    overflow-x: hidden;
  }

  .wrap { max-width: 1180px; margin: 0 auto; }

  /* ---------- header banner ---------- */
  .banner {
    position: relative; overflow: hidden;
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 18px; flex-wrap: wrap;
    padding: 20px 24px; margin-bottom: 22px;
    border: 1px solid var(--rule); border-radius: var(--radius);
    box-shadow: var(--card-shadow);
    background:
      radial-gradient(130% 150% at 0% 0%, color-mix(in srgb, var(--win) 9%, transparent), transparent 52%),
      radial-gradient(130% 150% at 100% 0%, color-mix(in srgb, #2f6fb0 9%, transparent), transparent 52%),
      var(--paper);
  }
  /* host-nation accent: Canada red · Mexico green · USA navy */
  .banner::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg,
      #d52b1e 0%, #d52b1e 30%, #006847 38%, #006847 62%, #2a3a7a 70%, #2a3a7a 100%);
    opacity: .85;
  }
  .title h1 {
    font-size: 30px; font-weight: 600; letter-spacing: -0.4px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .title h1 .trophy { filter: saturate(1.05); }
  /* host-nation flags woven into the banner as a low-opacity watermark */
  .banner > .title, .banner > .tools { position: relative; z-index: 1; }
  .hostflags {
    position: absolute; top: -16px; right: -8px; z-index: 0;
    font-size: 96px; line-height: 1; letter-spacing: 4px;
    opacity: .12; pointer-events: none; user-select: none; white-space: nowrap;
  }

  /* live status pill */
  .statuspill {
    display: inline-flex; align-items: center; gap: 7px;
    font-family: 'DM Mono', monospace; font-size: 11px; letter-spacing: .2px;
    color: var(--ink-muted); background: var(--bg);
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 3px 11px 3px 9px; vertical-align: middle;
  }
  .statuspill .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--win);
    box-shadow: 0 0 0 0 color-mix(in srgb, var(--win) 70%, transparent);
    animation: pulse 2.2s ease-out infinite;
  }
  .statuspill.gold .dot { background: var(--accent); box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 70%, transparent); }
  .statuspill.muted .dot { background: var(--ink-faint); animation: none; }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 color-mix(in srgb, currentColor 0%, var(--win) 55%); }
    70%  { box-shadow: 0 0 0 7px transparent; }
    100% { box-shadow: 0 0 0 0 transparent; }
  }
  @media (prefers-reduced-motion: reduce) { .statuspill .dot { animation: none; } }
  .tools { display: flex; gap: 8px; align-items: center; }
  button.tool {
    font-family: 'DM Mono', monospace; font-size: 12px;
    background: var(--paper); color: var(--ink-muted);
    border: 1px solid var(--rule); border-radius: 999px;
    padding: 7px 13px; cursor: pointer; transition: all .18s ease;
  }
  button.tool:hover { color: var(--ink); border-color: var(--ink-faint); transform: translateY(-1px); }

  .legend {
    display: flex; gap: 16px; flex-wrap: wrap; margin: 0 0 4px;
    font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--ink-faint);
  }
  .legend span { display: flex; align-items: center; gap: 5px; }
  .legend i { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
  .tzline { font-family: 'DM Mono', monospace; font-size: 10.5px; color: var(--ink-faint); margin-top: 2px; }

  /* ---------- section headings ---------- */
  .section-head { display: flex; align-items: center; gap: 14px; margin: 34px 0 18px; }
  .section-head h2 {
    font-size: 16px; font-weight: 600; letter-spacing: 1.5px;
    text-transform: uppercase; color: var(--ink-muted); white-space: nowrap;
  }
  .section-head .line { flex: 1; height: 1px; background: var(--rule); }

  /* ---------- group grid ---------- */
  .groups { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); }
  .group {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: var(--radius); padding: 15px 16px 13px; box-shadow: var(--card-shadow);
  }
  .group-title { display: flex; align-items: baseline; gap: 8px; margin-bottom: 10px; }
  .group-title .letter {
    font-family: 'DM Mono', monospace; font-weight: 500; font-size: 13px;
    color: var(--paper); background: var(--ink);
    width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center;
  }
  .group-title .label { font-size: 12.5px; color: var(--ink-faint); letter-spacing: .5px; }

  /* standings table — colour strip lives on a dedicated first column so it
     stays pixel-aligned with each row regardless of cell content/flex. */
  table.stand { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
  table.stand th {
    font-family: 'DM Mono', monospace; font-weight: 400; font-size: 10px;
    color: var(--ink-faint); text-align: center; padding: 2px 3px;
    text-transform: uppercase; letter-spacing: .5px;
  }
  table.stand th.team-col { text-align: left; }
  table.stand td {
    font-size: 13px; padding: 5px 3px; text-align: center;
    border-top: 1px solid var(--rule);
  }
  table.stand th.strip, table.stand td.strip { width: 4px; padding: 0; border-top: none; }
  table.stand td.strip { background: transparent; }
  table.stand tr.q1 td.strip { background: var(--win); }
  table.stand tr.q2 td.strip { background: var(--accent); }
  table.stand tr.q3 td.strip { background: var(--ink-faint); }
  table.stand td.team-col { text-align: left; }
  table.stand td.team-col .tw { display: flex; align-items: center; gap: 7px; overflow: hidden; }
  table.stand td.team-col .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  table.stand td.pts { font-weight: 600; font-family: 'DM Mono', monospace; }
  .flag { font-size: 15px; line-height: 1; flex-shrink: 0; }

  /* fixtures */
  .fixtures { display: flex; flex-direction: column; gap: 3px; }
  .fix {
    padding: 5px 8px; border-radius: 8px; border: 1px solid transparent;
    transition: background .3s, border-color .3s;
  }
  .fix.today { background: var(--today-bg); border-color: color-mix(in srgb, var(--today) 22%, transparent); }
  .fix.tomorrow { background: var(--tom-bg); }
  .fix .when {
    font-family: 'DM Mono', monospace; font-size: 9.5px; color: var(--ink-faint);
    display: flex; align-items: center; gap: 6px; margin-bottom: 2px;
  }
  .fix.today .when { color: var(--today); }
  .fix .chip {
    font-size: 8px; letter-spacing: .6px; text-transform: uppercase;
    padding: 1px 5px; border-radius: 999px; font-weight: 500;
  }
  .fix.today .chip { background: var(--today); color: var(--paper); }
  .fix.tomorrow .chip { background: color-mix(in srgb, var(--accent) 75%, transparent); color: var(--paper); }
  .fix .match {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    gap: 8px; font-size: 12.5px;
  }
  .fix .home { text-align: right; display: flex; justify-content: flex-end; align-items: center; gap: 6px; overflow: hidden; }
  .fix .away { text-align: left; display: flex; justify-content: flex-start; align-items: center; gap: 6px; overflow: hidden; }
  .fix .home .nm, .fix .away .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fix .score { display: flex; align-items: center; gap: 3px; }
  input.sc {
    width: 30px; height: 26px; text-align: center; font-family: 'DM Mono', monospace;
    font-size: 13px; border: 1px solid var(--rule); border-radius: 6px;
    background: var(--bg); color: var(--ink); -moz-appearance: textfield;
  }
  input.sc::-webkit-outer-spin-button, input.sc::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input.sc:focus { outline: none; border-color: var(--accent); background: var(--paper); }
  .fix .dash { color: var(--ink-faint); font-size: 11px; }

  /* ---------- bracket ---------- */
  .bracket-scroll { overflow-x: auto; padding: 6px 2px 20px; }
  .bracket { display: flex; gap: 26px; min-width: max-content; align-items: stretch; }
  .round { display: flex; flex-direction: column; justify-content: space-around; gap: 12px; min-width: 188px; }
  .round-label {
    font-family: 'DM Mono', monospace; font-size: 10.5px; letter-spacing: 1px;
    text-transform: uppercase; color: var(--ink-faint); text-align: center; margin-bottom: 4px;
  }
  .tie {
    background: var(--paper); border: 1px solid var(--rule);
    border-radius: 10px; padding: 6px; box-shadow: var(--card-shadow);
  }
  .tie .mno {
    font-family: 'DM Mono', monospace; font-size: 8.5px; color: var(--ink-faint);
    text-align: center; margin-bottom: 3px; letter-spacing: .5px;
  }
  .tie .slot {
    display: grid; grid-template-columns: 1fr auto; align-items: center;
    gap: 6px; padding: 4px 5px; border-radius: 6px; font-size: 12.5px; min-height: 30px;
  }
  .tie .slot + .slot { margin-top: 2px; border-top: 1px solid var(--rule); border-radius: 0 0 6px 6px; }
  .tie .slot .team { display: flex; align-items: center; gap: 6px; overflow: hidden; }
  .tie .slot .team .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tie .slot.tbd .team { color: var(--ink-faint); font-style: italic; }
  /* provisional group placing — settled once the group finishes */
  .tie .slot .nm.prov { border-bottom: 1px dotted var(--ink-faint); opacity: .85; }
  .tie .slot.won .nm { font-weight: 600; color: var(--win); }
  .tie input.sc { width: 28px; height: 24px; font-size: 12px; border-radius: 5px; }
  .tie input.sc:focus { border-color: var(--accent); }
  .tie input.sc:disabled { opacity: .4; }
  .tie .pens {
    display: flex; gap: 4px; justify-content: center; align-items: center; flex-wrap: wrap;
    margin-top: 4px; font-family: 'DM Mono', monospace; font-size: 9px; color: var(--ink-faint);
  }
  .tie .pens button {
    font-family: 'DM Mono', monospace; font-size: 9px; cursor: pointer;
    border: 1px solid var(--rule); background: var(--bg); color: var(--ink-muted);
    border-radius: 4px; padding: 1px 6px; max-width: 78px; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
  }
  .tie .pens button.sel { background: var(--accent); color: var(--paper); border-color: var(--accent); }

  /* champion */
  .champ {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; min-width: 150px;
  }
  .champ .cup { font-size: 40px; filter: grayscale(.3); transition: filter .4s, transform .4s; }
  .champ.crowned .cup { filter: none; transform: scale(1.12); }
  .champ .who {
    font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 8px; min-height: 26px;
  }
  .champ .who.tbd { color: var(--ink-faint); font-style: italic; font-size: 14px; }
  .champ .cap { font-family: 'DM Mono', monospace; font-size: 9px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--ink-faint); }

  .hint { font-size: 11.5px; color: var(--ink-faint); font-style: italic; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="banner">
    <div class="hostflags" aria-hidden="true">🇨🇦🇲🇽🇺🇸</div>
    <div class="title">
      <h1><span class="trophy">🏆</span> World Cup 2026 Wall Chart
        <span class="statuspill" id="statusPill"><span class="dot"></span><span class="txt"></span></span>
      </h1>
    </div>
    <div class="tools">
      <button class="tool" id="themeBtn">◐ theme</button>
      <button class="tool" id="exportBtn">⤓ export</button>
      <button class="tool" id="resetBtn">↺ reset</button>
    </div>
  </header>

  <div class="legend">
    <span><i style="background:var(--win)"></i> wins group / advancing</span>
    <span><i style="background:var(--accent)"></i> runner-up</span>
    <span><i style="background:var(--ink-faint)"></i> 3rd (may qualify)</span>
  </div>
  <div class="tzline" id="tzline"></div>

  <div class="section-head"><h2>Group Stage</h2><div class="line"></div></div>
  <div class="groups" id="groups"></div>

  <div class="section-head"><h2>Knockouts</h2><div class="line"></div></div>
  <p class="hint" id="koHint"></p>
  <div class="bracket-scroll"><div class="bracket" id="bracket"></div></div>
</div>

  GROUPS[g].forEach(t => rows[t] = {team:t,P:0,W:0,D:0,L:0,GF:0,GA:0,GD:0,Pts:0});
  FIX[g].forEach(fx => {
    const r = state.group[fx[0]];
    if(!r || r.a===""||r.b===""||r.a==null||r.b==null) return;
    const h=+r.a, a=+r.b, H=rows[fx[2]], A=rows[fx[3]];
    H.P++; A.P++; H.GF+=h; H.GA+=a; A.GF+=a; A.GA+=h;
    if(h>a){ H.W++; A.L++; H.Pts+=3; }
    else if(a>h){ A.W++; H.L++; A.Pts+=3; }
    else { H.D++; A.D++; H.Pts++; A.Pts++; }
  });
  return Object.values(rows).map(r => (r.GD=r.GF-r.GA, r))
    .sort((x,y)=> y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || x.team.localeCompare(y.team));
}

function groupComplete(g){
  for(const fx of FIX[g]){
    const r = state.group[fx[0]];
    if(!r || r.a===""||r.b===""||r.a==null||r.b==null) return false;
  }
  return true;
}
function groupsComplete(){
  for(const g in GROUPS) if(!groupComplete(g)) return false;
  return true;
}
// every team in the group has played at least once (i.e. matchday 1 is done) —
// the point at which provisional standings become meaningful in the bracket.
function groupRevealed(g){
  return standings(g).every(r => r.P >= 1);
}

/* ----- third-place qualifiers + official allocation ----- */
let THIRDS = {};   // match number -> qualified third team (recomputed each render)
function computeThirds(){
  THIRDS = {};
  if(!groupsComplete()) return;
  // rank all 12 third-placed teams; best 8 qualify
  const thirds = [];
  for(const g in GROUPS){ const s = standings(g); thirds.push(Object.assign({g}, s[2])); }
  thirds.sort((x,y)=> y.Pts-x.Pts || y.GD-x.GD || y.GF-x.GF || x.g.localeCompare(y.g));
  const qualGroups = thirds.slice(0,8).map(t=>t.g);
  const key = qualGroups.slice().sort().join("");
  const val = THIRD_ALLOC[key];
  if(!val) return; // shouldn't happen — table covers all 495 combos
  MATCH_ORDER.forEach((m,i) => { THIRDS[m] = standings(val[i])[2].team; });
}

/* ============================================================
   KNOCKOUT RESOLUTION
   ============================================================ */
function resolveSource(src){
  if(src.t==='g'){ if(!groupRevealed(src.g)) return null; const s = standings(src.g); return s[src.r-1] ? s[src.r-1].team : null; }
  if(src.t==='3'){ return THIRDS[src.slot] || null; }
  if(src.t==='w'){ return koWinner(src.m); }
  return null;
}
function koWinner(m){
  const M = KO[m]; if(!M) return null;
  const ta = resolveSource(M.a), tb = resolveSource(M.b);
  if(!ta || !tb) return null;
  const r = state.ko[m]; if(!r) return null;
  if(r.a===""||r.b===""||r.a==null||r.b==null) return null;
  if(+r.a>+r.b) return ta;
  if(+r.b>+r.a) return tb;
  const p = state.pens[m];
  return p==='a' ? ta : p==='b' ? tb : null;
}

/* ============================================================
   DATE / TIME (local to the viewer's timezone)
   ============================================================ */
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fmtWhen(iso){
  const d = new Date(iso);
  const date = DOW[d.getDay()] + " " + d.getDate() + " " + MON[d.getMonth()];
  const time = String(d.getHours()).padStart(2,'0') + ":" + String(d.getMinutes()).padStart(2,'0');
  return date + " · " + time;
}
function dayOffset(iso){
  const d = new Date(iso), n = new Date();
  const a = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const b = new Date(n.getFullYear(),n.getMonth(),n.getDate());
  return Math.round((a-b)/86400000);
}

/* ============================================================
   RENDER
   ============================================================ */
const $ = s => document.querySelector(s);
function teamHTML(name){
  if(!name) return `<span class="team"><span class="nm">TBD</span></span>`;
  return `<span class="team"><span class="flag">${FLAG[name]||""}</span><span class="nm">${name}</span></span>`;
}

function renderGroups(){
  const host = $("#groups"); host.innerHTML = "";
  for(const g in GROUPS){
    const s = standings(g);
    const card = document.createElement("div");
    card.className = "group";
    const rows = s.map((r,i)=>{
      const cls = i===0?"q1":i===1?"q2":i===2?"q3":"";
      return `<tr class="${cls}">
        <td class="strip"></td>
        <td class="team-col"><span class="tw"><span class="flag">${FLAG[r.team]||""}</span><span class="nm">${r.team}</span></span></td>
        <td>${r.P}</td><td>${r.W}</td><td>${r.D}</td><td>${r.L}</td>
        <td>${r.GD>0?"+":""}${r.GD}</td><td class="pts">${r.Pts}</td></tr>`;
    }).join("");
    const fixes = FIX[g].map(fx=>{
      const [no,iso,home,away] = fx;
      const r = state.group[no] || {a:"",b:""};
      const off = dayOffset(iso);
      const cls = off===0?"today":off===1?"tomorrow":"";
      const chip = off===0?`<span class="chip">today</span>`:off===1?`<span class="chip">tomorrow</span>`:"";
      return `<div class="fix ${cls}">
        <div class="when">${fmtWhen(iso)} ${chip}</div>
        <div class="match">
          <span class="home"><span class="nm">${home}</span><span class="flag">${FLAG[home]||""}</span></span>
          <span class="score">
            <input class="sc" type="number" min="0" inputmode="numeric" data-gm="${no}" data-side="a" value="${r.a}">
            <span class="dash">–</span>
            <input class="sc" type="number" min="0" inputmode="numeric" data-gm="${no}" data-side="b" value="${r.b}">
          </span>
          <span class="away"><span class="flag">${FLAG[away]||""}</span><span class="nm">${away}</span></span>
        </div>
      </div>`;
    }).join("");
    card.innerHTML = `
      <div class="group-title"><span class="letter">${g}</span><span class="label">Group ${g}</span></div>
      <table class="stand">
        <tr><th class="strip"></th><th class="team-col">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr>
        ${rows}
      </table>
      <div class="fixtures">${fixes}</div>`;
    host.appendChild(card);
  }
}

function slotEl(m, side, src, resolved, winner){
  const wrap = document.createElement("div");
  wrap.className = "slot" + (resolved?"":" tbd") + (winner&&resolved===winner?" won":"");
  let teamPart;
  if(resolved){
    // provisional = a live group placing whose group hasn't finished yet
    const prov = src.t==='g' && !groupComplete(src.g);
    teamPart = `<span class="team"><span class="flag">${FLAG[resolved]||""}</span><span class="nm${prov?' prov':''}">${resolved}</span></span>`;
  }
  else if(src.t==='3') teamPart = `<span class="team"><span class="nm">3rd ${src.groups.join("/")}</span></span>`;
  else teamPart = `<span class="team"><span class="nm">${labelFor(src)}</span></span>`;
  const r = state.ko[m] || {a:"",b:""};
  const disabled = resolved ? "" : "disabled";
  wrap.innerHTML = `${teamPart}<input class="sc" type="number" min="0" inputmode="numeric" data-ko="${m}" data-side="${side}" value="${r[side]}" ${disabled}>`;
  return wrap;
}
function labelFor(src){
  if(src.t==='g') return "Group " + src.g + (src.r===1?" · 1st":src.r===2?" · 2nd":" · 3rd");
  if(src.t==='w') return "Winner " + src.m;
  return "TBD";
}
function tieEl(m){
  const M = KO[m];
  const ta = resolveSource(M.a), tb = resolveSource(M.b);
  const w = koWinner(m);
  const el = document.createElement("div");
  el.className = "tie";
  el.innerHTML = `<div class="mno">Match ${m}</div>`;
  el.appendChild(slotEl(m,'a',M.a,ta,w));
  el.appendChild(slotEl(m,'b',M.b,tb,w));
  const r = state.ko[m];
  if(ta && tb && r && r.a!=="" && r.b!=="" && r.a!=null && r.b!=null && +r.a===+r.b){
    const p = state.pens[m];
    const pens = document.createElement("div");
    pens.className = "pens";
    pens.innerHTML = `pens
      <button data-pen="${m}" data-win="a" class="${p==='a'?'sel':''}">${ta}</button>
      <button data-pen="${m}" data-win="b" class="${p==='b'?'sel':''}">${tb}</button>`;
    el.appendChild(pens);
  }
  return el;
}

function renderBracket(){
  computeThirds();
  const host = $("#bracket"); host.innerHTML = "";
  ROUNDS.forEach(round => {
    const col = document.createElement("div");
    col.className = "round";
    col.innerHTML = `<div class="round-label">${round.label}</div>`;
    round.ms.forEach(m => col.appendChild(tieEl(m)));
    host.appendChild(col);
  });
  const champ = document.createElement("div");
  champ.className = "champ";
  const w = koWinner(104);
  champ.classList.toggle("crowned", !!w);
  champ.innerHTML = `<div class="cap">Champions</div><div class="cup">🏆</div>
    <div class="who ${w?'':'tbd'}">${w?`<span class="flag">${FLAG[w]||""}</span>${w}`:"—"}</div>`;
  host.appendChild(champ);

  setStatusPill();
  $("#koHint").textContent = groupsComplete()
    ? "Groups are in — the eight best third-placed teams have been slotted automatically using FIFA's official allocation table."
    : "Top 2 of each group qualify automatically. The eight best third-placed teams fill the dashed slots — these resolve themselves (via FIFA's official allocation) once every group match has a score.";
}

/* preserve focus + caret + scroll across full re-render (no more jump) */
function rerender(fn){
  const ae = document.activeElement;
  let key = null, caret = null;
  if(ae && ae.classList && ae.classList.contains('sc')){
    key = ae.dataset.gm!==undefined ? ['gm',ae.dataset.gm,ae.dataset.side]
        : ae.dataset.ko!==undefined ? ['ko',ae.dataset.ko,ae.dataset.side] : null;
    caret = ae.selectionStart;
  }
  const sx = window.scrollX, sy = window.scrollY;
  fn();
  if(key){
    const sel = key[0]==='gm'
      ? `input[data-gm="${key[1]}"][data-side="${key[2]}"]`
      : `input[data-ko="${key[1]}"][data-side="${key[2]}"]`;
    const el = document.querySelector(sel);
    if(el){ el.focus({preventScroll:true}); try{ el.setSelectionRange(caret,caret); }catch(e){} }
  }
  window.scrollTo(sx, sy);
}

/* live status pill — reads the real date + tournament state */
function setStatusPill(){
  const pill = $("#statusPill"); if(!pill) return;
  const all = [];
  for(const g in GROUPS) FIX[g].forEach(fx => all.push(fx[1]));
  all.sort();
  const firstOff = dayOffset(all[0]);                 // days until first kickoff
  const lastOff  = dayOffset(all[all.length-1]);      // days until last group match
  let today = 0;
  for(const g in GROUPS) FIX[g].forEach(fx => { if(dayOffset(fx[1])===0) today++; });
  const champ = koWinner(104);

  let label, tone = "green";
  if(champ){ label = "Champions · " + champ; tone = "gold"; }
  else if(firstOff > 0){ label = firstOff + " day" + (firstOff>1?"s":"") + " to kick-off"; }
  else if(lastOff >= 0){ label = "Group stage · Day " + (1 - firstOff); }
  else if(dayOffset("2026-07-19T20:00:00Z") >= 0){ label = "Knockout stage"; tone = "gold"; }
  else { label = "Tournament over"; tone = "muted"; }

  if(today > 0 && !champ) label += " · " + today + " match" + (today>1?"es":"") + " today";
  pill.className = "statuspill" + (tone==="gold"?" gold":tone==="muted"?" muted":"");
  pill.querySelector(".txt").textContent = label;
}

function renderAll(){ renderGroups(); renderBracket(); }

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener("input", e => {
  const t = e.target;
  if(t.dataset.gm!==undefined && t.classList.contains("sc")){
    const id = t.dataset.gm;
    state.group[id] = state.group[id] || {a:"",b:""};
    state.group[id][t.dataset.side] = t.value;
    save(); rerender(renderAll);
  } else if(t.dataset.ko!==undefined && t.classList.contains("sc")){
    const m = t.dataset.ko;
    state.ko[m] = state.ko[m] || {a:"",b:""};
    state.ko[m][t.dataset.side] = t.value;
    save(); rerender(renderBracket);
  }
});
document.addEventListener("click", e => {
  if(e.target.dataset.pen!==undefined){
    state.pens[e.target.dataset.pen] = e.target.dataset.win;
    save(); rerender(renderBracket);
  }
});

$("#themeBtn").onclick = () => {
  state.theme = state.theme==="dark" ? "light" : "dark";
  document.body.classList.toggle("theme-dark", state.theme==="dark");
  save();
};
$("#resetBtn").onclick = () => {
  if(confirm("Clear all scores and predictions? This can't be undone.")){
    state = blank();
    document.body.classList.remove("theme-dark");
    save(); renderAll();
  }
};
$("#exportBtn").onclick = () => {
  const blob = new Blob([JSON.stringify(state,null,2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "world-cup-2026-wallchart.json"; a.click();
  URL.revokeObjectURL(url);
};

/* ============================================================
   BOOT
   ============================================================ */
document.body.classList.toggle("theme-dark", state.theme==="dark");
try {
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "your local time";
  $("#tzline").textContent = "Kick-off times shown in your timezone (" + tz + ")";
} catch(e){ $("#tzline").textContent = "Kick-off times shown in your local timezone"; }
renderAll();
</script>
